[project]
name = "bio-deep-research"
version = "0.1.0"
description = "A local biomedical literature research agent whose every citation is checked against the source record"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    # Uncapped on purpose: this SDK drives the Claude Code CLI, which updates
    # independently, so an old SDK is the likelier breakage.
    "claude-agent-sdk>=0.2.163",
    "fastapi>=0.140,<1",
    "uvicorn[standard]>=0.54,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.13,<3",
]

[tool.uv]
# The app is run from the checkout, not installed, so there is nothing to build.
package = false
